name: Claude review

# Manual only: a maintainer comments `@claude review` on a PR (fork PRs included).
# Claude reads the PR with read-only tools; a separate step posts its findings as a review.
# See .github/claude_review.py.
#
# Authenticates with workload identity federation, so there is no API key secret.
# The Anthropic federation rule only trusts this file, on main, for issue_comment
# events, so keep the path `.github/workflows/ClaudeReview.yml`.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Acknowledge
        id: ack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes --jq .id)
          echo "reaction_id=$id" >> "$GITHUB_OUTPUT"

      # Trusted copy of the reviewer and the repo's AGENTS.md/CLAUDE.md, from main.
      - uses: actions/checkout@v6
        with:
          path: base
          persist-credentials: false

      - name: Fetch PR diff
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha() { gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid; }
          sha=$(head_sha)
          gh pr diff "$PR_NUMBER" -R "$GITHUB_REPOSITORY" > pr.diff
          [ "$(head_sha)" = "$sha" ] || { echo "::error::PR head moved while fetching the diff"; exit 1; }
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      # The untrusted PR head, pinned to the SHA the diff was taken from. Only read, never run.
      - uses: actions/checkout@v6
        with:
          path: pr
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install --quiet 'claude-agent-sdk==0.2.165'

      - name: Review
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.CLAUDE_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.CLAUDE_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.CLAUDE_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
          PR_TITLE: ${{ github.event.issue.title }}
        run: |
          # GitHub OIDC tokens last about five minutes and each may be exchanged only
          # once, so keep a fresh one on disk for the SDK to re-read when it refreshes.
          fetch_token() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" &&
              mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token
          (while sleep 120; do fetch_token || true; done) &
          trap "kill $!" EXIT
          # Claude's process gets no means to mint more tokens.
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            python base/.github/claude_review.py run

      - name: Post review
        if: always() && steps.ack.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EYES_REACTION_ID: ${{ steps.ack.outputs.reaction_id }}
        run: python base/.github/claude_review.py post
