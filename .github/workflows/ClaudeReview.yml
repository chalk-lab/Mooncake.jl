name: Claude review

# Manual only: a maintainer comments `@claude review` on a PR (fork PRs included).
# Claude reads the PR with read-only tools; a separate step posts its findings as a review.
# See .github/claude_review.py.
#
# Authenticates with workload identity federation, so there is no API key secret.
# The Anthropic federation rule only trusts this file, on main, for issue_comment
# events, so keep the path `.github/workflows/ClaudeReview.yml`.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      BASE_DIR: ${{ github.workspace }}/base
      PR_DIR: ${{ github.workspace }}/pr
      REVIEW_INPUT_DIR: ${{ github.workspace }}/review-input
      REVIEW_OUT: ${{ github.workspace }}/review.json
    steps:
      # Trusted copy of the reviewer and the repo's AGENTS.md/CLAUDE.md, from main.
      - uses: actions/checkout@v6
        with:
          path: base
          persist-credentials: false

      - name: Post progress comment
        id: progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I base/.github/claude_review.py start

      - name: Fetch PR metadata and diff
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$REVIEW_INPUT_DIR"
          gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json title,headRefOid > "$REVIEW_INPUT_DIR/pr.json"
          gh pr diff "$PR_NUMBER" -R "$GITHUB_REPOSITORY" > "$REVIEW_INPUT_DIR/pr.diff"
          echo "head_sha=$(jq -r .headRefOid "$REVIEW_INPUT_DIR/pr.json")" >> "$GITHUB_OUTPUT"

      # The untrusted PR head, pinned to the SHA the diff was taken from. Only read, never run.
      - uses: actions/checkout@v6
        with:
          path: pr
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Claude Agent SDK
        run: pip install --quiet 'claude-agent-sdk==0.2.165'

      - name: Review
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.CLAUDE_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.CLAUDE_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.CLAUDE_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc/token
          CLAUDE_MODEL: claude-opus-5-5
          CLAUDE_EFFORT: high
          CLAUDE_MAX_BUDGET_USD: '10'
          CLAUDE_TASK_BUDGET: '400000'
          # Only for update_progress; the script drops it before starting Claude.
          GITHUB_TOKEN: ${{ github.token }}
          PROGRESS_COMMENT_ID: ${{ steps.progress.outputs.comment_id }}
        run: |
          # GitHub OIDC tokens last about five minutes and each may be exchanged only
          # once, so keep a fresh one on disk for the SDK to re-read when it refreshes.
          mkdir -p "$(dirname "$ANTHROPIC_IDENTITY_TOKEN_FILE")"
          fetch_token() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" &&
              mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token
          (while sleep 120; do fetch_token || true; done) &
          refresher=$!
          # Claude's process gets no means to mint more tokens.
          status=0
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            python -I base/.github/claude_review.py run || status=$?
          kill "$refresher"
          exit "$status"

      - name: Post review
        if: always() && steps.progress.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PROGRESS_COMMENT_ID: ${{ steps.progress.outputs.comment_id }}
        run: python -I base/.github/claude_review.py post
