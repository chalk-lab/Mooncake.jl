# Previews by default; decisions are printed to the log. To enable writes:
#   1. Create the `keep-open` label and remove the "Not active yet" note from
#      .github/triage/README.md.
#   2. Set the variable TRIAGE_START_DATE (YYYY-MM-DD, UTC); older items are exempt,
#      1970-01-01 includes everything. Then do a manual run with `apply` checked.
#   3. Set TRIAGE_APPLY=true for scheduled writes; unset it to go back to previews.
name: Contributor triage

on:
  pull_request:
    paths:
      - '.github/APPROVED_CONTRIBUTORS'
      - '.github/triage/**'
      - '.github/workflows/triage.yml'
  push:
    branches: [main]
    paths:
      - '.github/APPROVED_CONTRIBUTORS'
      - '.github/triage/**'
      - '.github/workflows/triage.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (requires TRIAGE_START_DATE; otherwise preview only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test .github/triage/triage.test.mjs

  triage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: contributor-triage
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Preview or apply triage
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAGE_START_DATE: ${{ vars.TRIAGE_START_DATE }}
          TRIAGE_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || github.event_name == 'schedule' && vars.TRIAGE_APPLY == 'true' }}
        run: node .github/triage/triage.mjs
